name: Deploy to AWS S3

on:
  push:
    branches:
      - deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # You can adjust this based on your node version

      - name: Install Dependencies
        run: npm ci # Uses package-lock.json for reliable installs. (Use `bun install` if you prefer Bun)

      - name: Build the Project
        run: npm run build
        env:
          API_URL: ${{ secrets.API_URL }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1 # Mumbai region

      - name: Deploy to S3 Bucket
        # TanStack Start outputs client files to dist/client
        run: aws s3 sync ./dist/client s3://global-product-search.bethmina.site --delete

      # Optional: Invalidate CloudFront cache so changes reflect immediately
      # - name: Invalidate CloudFront
      #   run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
