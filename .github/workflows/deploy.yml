name: Deploy to EC2

on:
  push:
    branches:
      - deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Build the Project
        run: npm run build
        env:
          API_URL: ${{ secrets.API_URL }}

      - name: Create Deployment Package
        run: |
          mkdir deploy_package
          cp -r dist deploy_package/
          cp package.json deploy_package/
          cp package-lock.json deploy_package/
          echo "API_URL=${{ secrets.API_URL }}" > deploy_package/.env
          tar -czf deploy.tar.gz -C deploy_package .

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy.tar.gz"
          target: "/home/ubuntu/global-product-search-frontend"

      - name: Extract and Restart PM2 on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/global-product-search-frontend
            # Extract the new build
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz
            
            # Install production dependencies
            npm ci --production
            
            # Delete the old npm-based process so we can recreate it cleanly
            pm2 delete frontend || true
            
            # Start the Node server directly with PM2 to capture real error logs
            PORT=3001 pm2 start dist/server/server.js --name "frontend"
